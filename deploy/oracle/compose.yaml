name: naukri-automation
services:
  runner:
    image: naukri-automation:local
    build:
      context: ../..
      dockerfile: deploy/oracle/Dockerfile
    init: true
    user: "${RUNNER_UID:-1000}:${RUNNER_GID:-1000}"
    environment:
      DATA_DIR: /data
      BROWSER_CHANNEL: bundled
      TZ: Asia/Kolkata
    volumes:
      - type: bind
        source: ../../.env
        target: /app/.env
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../data
        target: /data
        bind:
          create_host_path: false
    # Only login runs publish this port; reach it through an SSH tunnel.
    ports:
      - "127.0.0.1:5901:5900"
    mem_limit: 4g
    memswap_limit: 4g
    cpus: 1.5
    pids_limit: 512
    shm_size: 1gb
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
